version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santesenegal-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET manquant}
      - Jwt__Issuer=${JWT_ISSUER:-SanteSenegal}
      - Jwt__Audience=${JWT_AUDIENCE:-SanteSenegalMobile}
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/v1/swagger.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optionnel : PostgreSQL pour production
  # db:
