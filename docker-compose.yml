  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

